<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Monitoring and Observability Platform - obsd</title>

    <style>
      :root {
        --bg: #0f1115; 
        --panel: #171a21; 
        --line: #252a33; 
        --text: #e6e8ee; 
        --muted: #8a90a0;
        --ok: #3fb950; 
        --bad: #f85149; 
        --warn: #d29922;
      }

      * { 
        box-sizing: border-box;
      }
      
      body {
        margin: 0; 
        font: 14px/1.4 system-ui, sans-serif; 
        background: var(--bg); 
        color: var(--text);
        display: grid; 
        grid-template-columns: 260px 1fr; 
        min-height: 100vh;
      }
      
      aside { 
        background: var(--panel);
        padding: 16px;
        overflow: auto;
        border-right: 1px solid var(--line);
        max-height: 100vh;
        position: sticky;
        top: 0;
      }
      
      main { 
        padding: 16px; 
        display: grid; 
        gap: 16px; 
        align-content: start;
      }
      
      h1 { 
        font-size: 16px;
        margin: 0 0 12px;
      }
      
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      
      input {
        width: 100%;
        padding: 6px 8px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid #2b313c;
        border-radius: 6px;
      }
      
      .metric { 
        display: block; 
        padding: 6px 8px; 
        border-radius: 6px; 
        cursor: pointer; 
        word-break: break-all; 
      }
      
      .metric:hover, .metric.active { 
        background: #1f2430; 
      }
      
      .panel { 
        background: var(--panel); 
        border-radius: 10px; 
        padding: 14px; 
        overflow-x: auto; 
      }
      
      svg { 
        width: 100%; 
        height: 240px; 
        display: block; 
      }
      
      table { 
        width: 100%; 
        border-collapse: collapse; 
      }
      
      th, td { 
        text-align: left; 
        padding: 6px; 
        border-bottom: 1px solid var(--line); 
        font-size: 13px; 
        vertical-align: top; 
      }
      
      .pill { 
        padding: 2px 8px; 
        border-radius: 999px; 
        font-size: 12px; 
      }
      
      .up, .inactive { 
        background: rgba(63,185,80,.15); 
        color: var(--ok); 
      }
      
      .down, .firing { 
        background: rgba(248,81,73,.15); 
        color: var(--bad); 
      }
      
      .pending { 
        background: rgba(210,153,34,.15); 
        color: var(--warn);
      }
      
      .muted { 
        color: var(--muted); 
      }
      
      @media (max-width: 800px) {
        body { grid-template-columns: 1fr; }
        aside { position: static; max-height: none; }
      }
    </style>
  </head>

  <body>
    <aside>
      <h1>Monitoring and Observability Platform - obsd</h1>
      <input id="filter" placeholder="Filter metrics…">

      <h2 style="margin-top:14px">Metrics</h2>
      <div id="metrics"></div>
    </aside>

    <main>
      <div class="panel">
        <h2 id="title">Select a metric</h2>
        <svg id="chart" viewBox="0 0 800 240" preserveAspectRatio="none"></svg>
        <div id="legend" class="muted" style="margin-top:8px;font-size:12px"></div>
      </div>

      <div class="panel"><h2>Alerts</h2><table id="alerts"></table></div>

      <div class="panel"><h2>Scrape targets</h2><table id="targets"></table></div>
    </main>


    <script>
      const state = { metric: null, names: [] };
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const labelStr = (l) => Object.entries(l || {}).map(([k, v]) => `${k}="${v}"`).join(', ');
      const COLORS = ['#4cc2ff', '#ffb454', '#c792ea', '#7fd962', '#f07178', '#89ddff'];

      async function getJSON(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`${url} -> ${r.status}`);
        return r.json();
      }

      function renderMetrics() {
        const f = $('filter').value.toLowerCase();
        $('metrics').innerHTML = state.names
          .filter(n => n.toLowerCase().includes(f))
          .map(n => `<span class="metric ${n === state.metric ? 'active' : ''}" data-name="${esc(n)}">${esc(n)}</span>`)
          .join('');
      }

      $('metrics').addEventListener('click', (e) => {
        const el = e.target.closest('.metric');
        if (!el) return;
        state.metric = el.dataset.name;
        renderMetrics();
        refreshChart();
      });
      $('filter').addEventListener('input', renderMetrics);

      async function refreshChart() {
        if (!state.metric) return;
        $('title').textContent = state.metric;
        const from = new Date(Date.now() - 3600 * 1000).toISOString();
        try {
          const res = await getJSON(`/api/v1/query?name=${encodeURIComponent(state.metric)}&from=${encodeURIComponent(from)}&step=15s`);
          drawChart(res.data);
        } catch (e) {
          console.error(e);
        }
      }

      function drawChart(series) {
        const svg = $('chart');
        const W = 800, H = 240, P = 8;
        const all = series.flatMap(s => s.samples.filter(p => p.v !== null));
        if (!all.length) {
          svg.innerHTML = '<text x="10" y="20" fill="#8a90a0">No data in the last hour</text>';
          $('legend').textContent = '';
          return;
        }
        const t0 = Math.min(...all.map(p => p.t));
        const t1 = Math.max(...all.map(p => p.t));
        let v0 = Math.min(...all.map(p => p.v));
        let v1 = Math.max(...all.map(p => p.v));
        if (v0 === v1) { v0 -= 1; v1 += 1; }
        const x = t => P + (t - t0) / Math.max(1, t1 - t0) * (W - 2 * P);
        const y = v => H - P - (v - v0) / (v1 - v0) * (H - 2 * P);

        const shown = series.slice(0, COLORS.length);
        svg.innerHTML = shown.map((s, i) => {
          const pts = s.samples.filter(p => p.v !== null)
            .map(p => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
          return `<polyline fill="none" stroke="${COLORS[i]}" stroke-width="2" points="${pts}"/>`;
        }).join('');

        $('legend').innerHTML = shown.map((s, i) =>
          `<span style="color:${COLORS[i]}">■</span> ${esc(labelStr(s.labels)) || '(no labels)'}`
        ).join('<br>') + (series.length > shown.length ? `<br>+${series.length - shown.length} more` : '');
      }

      async function refreshSide() {
        try {
          const alerts = await getJSON('/api/v1/alerts');
          $('alerts').innerHTML = alerts.length
            ? '<tr><th>Rule</th><th>Series</th><th>Value</th><th>State</th></tr>' + alerts.map(a =>
                `<tr><td>${esc(a.rule)}</td><td class="muted">${esc(labelStr(a.series))}</td>` +
                `<td>${Number(a.value).toFixed(3)}</td><td><span class="pill ${esc(a.state)}">${esc(a.state)}</span></td></tr>`
              ).join('')
            : '<tr><td class="muted">No active alerts</td></tr>';

          const targets = await getJSON('/api/v1/targets');
          $('targets').innerHTML = '<tr><th>Job</th><th>URL</th><th>Status</th><th>Samples</th><th>Last scrape</th></tr>' +
            targets.map(t => {
              const pending = !t.last_scrape || t.last_scrape.startsWith('0001');
              const state = pending ? 'pending' : (t.up ? 'up' : 'down');
              const when = pending ? '—' : new Date(t.last_scrape).toLocaleTimeString();
              const err = t.error ? ` <span class="muted">${esc(t.error)}</span>` : '';
              return `<tr><td>${esc(t.job)}</td><td class="muted">${esc(t.url)}</td>` +
                `<td><span class="pill ${state}">${state}</span>${err}</td><td>${t.samples}</td>` +
                `<td class="muted">${when}</td></tr>`;
            }).join('');
        } catch (e) {
          console.error(e);
        }
      }

      async function refreshNames() {
        try {
          state.names = (await getJSON('/api/v1/series')) || [];
          renderMetrics();
        } catch (e) {
          console.error(e);
        }
      }

      async function tick() {
        await Promise.all([refreshNames(), refreshSide(), refreshChart()]);
      }

      tick();
      setInterval(tick, 15000);
    </script>
  </body>
</html>
